name: "Make CI Release"

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of the CI Build workflow (empty = last successful run on master)"
        required: false
      tag:
        description: "Release tag. 'continuous' is replaced on every release, any other tag must not exist yet"
        required: true
        default: continuous
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find CI run
        run: |
          run_id="${{ inputs.ci-run-id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow ci-build.yml --branch master --status success \
                       --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful CI Build run found"
            exit 1
          fi
          head_sha=$(gh run view "$run_id" --json headSha --jq .headSha)
          echo "Using CI run $run_id (commit $head_sha)"
          echo "CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "CI_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Download artifacts
        run: |
          gh run download "$CI_RUN_ID" --dir artifacts --pattern 'packages-*' --pattern 'klogg_version'
          ls -R artifacts

      - name: Prepare release assets
        run: |
          ./.github/scripts/prepare-release.sh artifacts release
          echo "KLOGG_VERSION=$(cat artifacts/klogg_version/klogg_version.txt)" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$RELEASE_TAG" = "continuous" ]; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            else
              echo "::error::Release $RELEASE_TAG already exists"
              exit 1
            fi
          fi

          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          cat > notes.md <<NOTES
          klogg $KLOGG_VERSION

          Built by CI run https://github.com/$GH_REPO/actions/runs/$CI_RUN_ID from commit $CI_HEAD_SHA.

          | Platform | Files |
          |---|---|
          | Windows x64 | \`*-setup.exe\` installer, \`*-portable.zip\` |
          | Ubuntu 24.04 | \`*-noble.deb\` |
          | Ubuntu 26.04 | \`*-resolute.deb\` |
          | Linux (other) | \`*-linux-bin.tar.gz\` |
          | macOS (Apple Silicon) | \`*-mac-arm64.dmg\` |

          Debug symbols: \`*-pdb.zip\`, \`*-linux-symbols.tar\`, \`*-dSYM.zip\`. Checksums: \`*-sha256.txt\`.
          NOTES

          gh release create "$RELEASE_TAG" release/* \
            --target "$CI_HEAD_SHA" \
            --title "klogg $KLOGG_VERSION" \
            --notes-file notes.md \
            $prerelease_flag
