name: "CI Build"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_dispatch:

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/klogg-version

      - name: Save version 
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  Linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: variar/klogg_ubuntu24.04
            cmake_opts:

          - os: ubuntu_resolute
            os_version: 26.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: resolute
            package_suffix: deb
            check_container: ubuntu:26.04
            container_root: docker/ubuntu26.04
            container: variar/klogg_ubuntu26.04
            cmake_opts:

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      #- uses: satackey/action-docker-layer-caching@v0.0.11
      #  # Ignore the failure of a step and avoid terminating the job.
      #  continue-on-error: true
      
      - name: Build container 
        run: |
          cd ${{ matrix.config.container_root }}
          docker build -t ${{ matrix.config.container }} .

      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build
      - uses: ./.github/actions/docker-run-tests
      - uses: ./.github/actions/docker-package
          
# Final upload of all packages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error      

  Mac:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            os_version: 15
            qt_version: 6.8.3
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      
#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*' 
          if-no-files-found: error

  Windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2025
            qt_version: 6.8.3
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_64
            arch: x64
            ssl_arch: -x64
            ssl_target: VC-WIN64A
            cmake_opts:
            artifacts_id: windows-x64-qt6

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}\openssl-1.1
          key: OpenSSL-1.1.1w-${{ matrix.config.arch }}

      - name: Set openssl paths
        shell: sh
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-1.1\${{ matrix.config.arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Build OpenSSL
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'openssl-1.1.1w.tar.gz'
          Invoke-WebRequest -Uri 'https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz' -OutFile $archive
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8') {
            throw "OpenSSL source archive SHA-256 mismatch: $actualHash"
          }

          tar -xzf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL source archive extraction failed with exit code $LASTEXITCODE" }
          $source = Join-Path $env:GITHUB_WORKSPACE 'openssl-1.1.1w'
          $prefix = Join-Path $env:GITHUB_WORKSPACE "openssl-1.1\${{ matrix.config.arch }}"
          Push-Location $source
          try {
            perl Configure ${{ matrix.config.ssl_target }} no-asm shared no-tests "--prefix=$prefix" "--openssldir=$prefix/ssl"
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL configuration failed with exit code $LASTEXITCODE" }
            nmake
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed with exit code $LASTEXITCODE" }
            nmake install_sw
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL installation failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Verify OpenSSL installation
        shell: pwsh
        run: |
          $sslDir = Join-Path $env:GITHUB_WORKSPACE "openssl-1.1\${{ matrix.config.arch }}\bin"
          $sslArch = '${{ matrix.config.ssl_arch }}'
          foreach ($name in @("libcrypto-1_1${sslArch}.dll", "libssl-1_1${sslArch}.dll")) {
            $path = Join-Path $sslDir $name
            if (-not (Test-Path -Path $path -PathType Leaf)) {
              throw "Expected OpenSSL DLL was not installed: $path"
            }
          }

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
     
# Final upload of all packages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
