name: "CI Build"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel superseded PR builds, keep every master build (releases use the last successful one)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  SaveVersion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/klogg-version

      - name: Save version 
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  Linux:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: variar/klogg_ubuntu24.04
            cmake_opts:

          - os: ubuntu_resolute
            os_version: 26.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: resolute
            package_suffix: deb
            check_container: ubuntu:26.04
            container_root: docker/ubuntu26.04
            container: variar/klogg_ubuntu26.04
            cmake_opts:

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build container
        uses: docker/build-push-action@v7.4.0
        env:
          # do not attach build records as extra *.dockerbuild artifacts
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.config.container_root }}
          tags: ${{ matrix.config.container }}
          load: true
          cache-from: type=gha,scope=${{ matrix.config.artifacts_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.config.artifacts_id }}

      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build
      - uses: ./.github/actions/docker-run-tests
      - uses: ./.github/actions/docker-package
          
# Final upload of all packages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error      

  AppImage:
    strategy:
      fail-fast: false
      matrix:
        config:
          # oldest supported Ubuntu LTS keeps glibc requirements low (2.35)
          - os: ubuntu
            os_version: 22.04
            qt_version: 6.8.3
            qt_arch: linux_gcc_64
            qt_modules: qt5compat
            # qtwayland provides the wayland platform plugin bundled by linuxdeploy-plugin-qt
            qt_archives: qtbase qtimageformats qtsvg qttools qttranslations icu qtwayland
            arch: x64
            cc: gcc-12
            cxx: g++-12
            cmake_opts:
            artifacts_id: appimage

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 ragel file libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build

      - uses: ./.github/actions/agent-run-tests
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build AppImage
        run: |
          cd "$KLOGG_BUILD_ROOT"
          "$GITHUB_WORKSPACE/packaging/linux/appimage/generate_appimage.sh"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*.AppImage'
          if-no-files-found: error

  Mac:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            os_version: 15
            qt_version: 6.8.3
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      
#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*' 
          if-no-files-found: error

  Windows:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2025
            qt_version: 6.8.3
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_64
            arch: x64
            cmake_opts:
            artifacts_id: windows-x64-qt6

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        shell: pwsh
        run: |
          # Load the MSVC developer environment (replaces ilammy/msvc-dev-cmd, which runs on Node 20)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with C++ tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" ${{ matrix.config.arch }} > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
     
# Final upload of all packages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
